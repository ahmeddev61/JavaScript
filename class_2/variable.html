<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // var keyword : can be declared / initilaize / can be re-declared and also can be re-assigned : syntax : var name = data
      var name = "ahmed";
      console.log(name);
      //   can be redeclared and reinitilize
      var name;
      name = "adil";
      console.log(name);
      //   can be reassigned
      name = "muhammad";
      console.log(name);

      // let keyword : can be declared / initilaize / cannot be redeclared /can be re-assigned : syntax : var name = data
      //   can be declared and initilize
      let Name = "ahmed";
      console.log(Name);
      //   cannot be redeclared
      //   let Name;
      //   can be re-assigned

      Name = "bilal";
      console.log(Name);
      //   const key word cannot be declared / cannot de redeclared and reassigned/ can be declared and initiliaze at the same time
      const pi = 3.14;
      console.log(pi);
      alert("all done");
      confirm("variable done");
    </script>
  </body>
</html>
